services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ATP_DB_PATH: /data/atp.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

