spring.application.name=fleet
# Порт — из переменной PORT; платформа запускает сервис на 8000.
server.port=${PORT:8000}
# Адрес базы — в DATABASE_URL (DatabaseConfig), папка для своих файлов — в DATA_DIR.

# Файлы импорта до 4 МБ (api-contract.md, 3); штатный лимит Spring — 1 МБ на файл.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Тело разбирается при первом обращении к файлу: сначала проверяется набор (UNKNOWN_DATASET),
# а битый multipart попадает в обработчик ошибок как FILE_REQUIRED.
spring.servlet.multipart.resolve-lazily=true
