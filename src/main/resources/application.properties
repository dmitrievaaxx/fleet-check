spring.application.name=fleet
# Порт — из переменной PORT; платформа запускает сервис на 8000.
server.port=${PORT:8000}
# Адрес базы — в DATABASE_URL (DatabaseConfig.kt), папка для своих файлов — в DATA_DIR.

# Выгрузки больше штатного 1 МБ (waybills.csv); multipart разбирается в контроллере, чтобы
# битое тело давало FILE_REQUIRED в формате контракта, а неизвестный набор проверялся раньше.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
spring.servlet.multipart.resolve-lazily=true

spring.main.banner-mode=off
spring.jmx.enabled=false
